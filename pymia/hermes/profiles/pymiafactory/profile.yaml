# PymIA Factory Profile — Configuration Template
#
# This file contains non-secret configuration for the pymiafactory Hermes profile.
# Secrets (API keys, tokens) must be provided via environment variables or .env files.
# See required_env.yaml for the list of required environment variables.

profile:
  name: pymiafactory
  version: "1.0.0"
  description: "PymIA Factory profile for Telegram integration with conversa-engine"

bridge:
  plugin: pymia-telegram-bridge
  repo_root: "E:\\BuenosPasos\\smartbridge\\PymIA"
  telegram_documents_dir: ".runtime/telegram_documents"

conversa:
  engine_path: "conversa-engine/main.py"
  default_tenant_id: "telegram:42"
  default_user_id: "42"

supermemory:
  enabled: true
  recall_before_reply: true

logging:
  level: INFO
  format: "%(asctime)s [%(name)s] %(levelname)s: %(message)s"
