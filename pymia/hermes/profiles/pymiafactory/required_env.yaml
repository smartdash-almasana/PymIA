# Required Environment Variables for pymiafactory Profile
#
# These variables MUST be provided via:
# - .env file in the profile directory
# - System environment variables
# - Secret management system
#
# DO NOT commit secrets to this file or to version control.

required:
  - name: TELEGRAM_BOT_TOKEN
    description: "Telegram bot token from @BotFather"
    example: "123456789:ABCdefGHIjklMNOpqrsTUVwxyz"
    source: "Telegram BotFather"

  - name: SUPERMEMORY_API_KEY
    description: "API key for Supermemory service"
    example: "sk_live_..."
    source: "Supermemory dashboard"

optional:
  - name: OPENROUTER_API_KEY
    description: "API key for OpenRouter (if using external LLM providers)"
    example: "sk-or-..."
    source: "OpenRouter dashboard"
    required_if: "Using OpenRouter as LLM provider"

  - name: PYMIA_REPO_ROOT
    description: "Absolute path to PymIA repo root (overrides profile.yaml)"
    example: "E:\\BuenosPasos\\smartbridge\\PymIA"
    default: "E:\\BuenosPasos\\smartbridge\\PymIA"
