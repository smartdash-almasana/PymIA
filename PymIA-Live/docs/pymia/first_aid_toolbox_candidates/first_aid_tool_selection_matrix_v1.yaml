metadata:
  artifact: first_aid_tool_selection_matrix_v1
  status: CANDIDATE_SELECTION
  purpose: "Resolver qué herramientas Exceland quedan para Primeros Auxilios PyME / Fase 1 y cuáles no entran en Fase 1."
  source_file: PymIA-Live/docs/pymia/first_aid_toolbox_candidates/first_aid_tool_activation_matrix_v1.yaml
  runtime_impact: NONE
  code_impact: NONE
  tests_run: NO

selection_policy:
  phase_1_rule: "Fase 1 calcula y ordena; no diagnostica."
  aggregation_rule: MAX_PHASE_WINS
  severity_order:
    - PHASE_2_DIAGNOSTIC
    - PHASE_1_WITH_GUARDRAILS
    - PHASE_1_READY
  decisions:
    USE_IN_PHASE_1: "Herramienta apta para Primeros Auxilios si la evidencia mínima está completa."
    USE_IN_PHASE_1_WITH_GUARDRAILS: "Herramienta apta para Primeros Auxilios sólo con límites explícitos y confirmación."
    NOT_FOR_PHASE_1_PHASE_2: "Herramienta no entra en Primeros Auxilios; pertenece a Fase 2 diagnóstico."
    REVIEW_REQUIRED: "Herramienta pendiente de revisión por mapping insuficiente o ambiguo."

forbidden_first_aid_language:
  forbidden_verbs:
    - indica
    - sugiere
    - confirma
    - diagnostica
    - certifica
  forbidden_claims:
    - diagnóstico integral de la empresa
    - diagnóstico financiero integral
    - resultado neto confirmado
    - rentabilidad real confirmada
    - precio óptimo definitivo
    - punto de equilibrio empresarial total sin evidencia suficiente
    - stock físico confirmado sin conteo
    - saldo bancario conciliado con una sola fuente

tools:
  - tool_id: flujo_de_fondos
    title: Flujo de Fondos Proyectado
    tool_phase: PHASE_1_READY
    decision: USE_IN_PHASE_1
    reason: "Usa sólo fórmulas PHASE_1_READY: flujo_caja_neto y saldo_acumulado."
    formulas_used:
      - flujo_caja_neto
      - saldo_acumulado
    owner_facing_limit: "Ordena ingresos, egresos y saldo acumulado con la evidencia entregada; no confirma caja real ni conciliación bancaria."

  - tool_id: proyeccion_ventas
    title: Proyección de Ventas
    tool_phase: PHASE_1_READY
    decision: USE_IN_PHASE_1
    reason: "Usa sólo fórmula PHASE_1_READY: ingresos_totales."
    formulas_used:
      - ingresos_totales
    owner_facing_limit: "Calcula ingresos con precio y unidades informadas; no interpreta rentabilidad ni estrategia comercial."

  - tool_id: auto_ganancia
    title: Caja Diaria
    tool_phase: PHASE_1_WITH_GUARDRAILS
    decision: USE_IN_PHASE_1_WITH_GUARDRAILS
    reason: "Combina fórmulas PHASE_1_READY con egresos_totales, clasificada con guardrails."
    formulas_used:
      - egresos_totales
      - flujo_caja_neto
      - ingresos_totales
      - saldo_acumulado
    owner_facing_limit: "Ordena caja diaria y saldos declarados; no confirma ganancia, caja final ni resultado contable."

  - tool_id: caja_diaria
    title: Caja Diaria Pro
    tool_phase: PHASE_1_WITH_GUARDRAILS
    decision: USE_IN_PHASE_1_WITH_GUARDRAILS
    reason: "Combina fórmulas PHASE_1_READY con egresos_totales, clasificada con guardrails."
    formulas_used:
      - egresos_totales
      - flujo_caja_neto
      - ingresos_totales
      - saldo_acumulado
    owner_facing_limit: "Ordena caja diaria y saldos declarados; no confirma ganancia, caja final ni resultado contable."

  - tool_id: costos_por_producto
    title: Costos por Producto
    tool_phase: PHASE_1_WITH_GUARDRAILS
    decision: USE_IN_PHASE_1_WITH_GUARDRAILS
    reason: "Usa ingresos_totales y egresos_totales; no debe presentarse como costo real confirmado."
    formulas_used:
      - egresos_totales
      - ingresos_totales
    owner_facing_limit: "Calcula costos e ingresos sobre datos entregados; no certifica costo total real ni margen neto."

  - tool_id: cuentas_corrientes_clientes
    title: Cuentas Corrientes Clientes
    tool_phase: PHASE_1_WITH_GUARDRAILS
    decision: USE_IN_PHASE_1_WITH_GUARDRAILS
    reason: "Usa saldo_acumulado y egresos_totales; requiere límites para no simular conciliación financiera."
    formulas_used:
      - egresos_totales
      - saldo_acumulado
    owner_facing_limit: "Ordena saldos y movimientos declarados; no confirma deuda real ni conciliación bancaria."

  - tool_id: precio_margen
    title: Calculadora Precio & Margen
    tool_phase: PHASE_1_WITH_GUARDRAILS
    decision: USE_IN_PHASE_1_WITH_GUARDRAILS
    reason: "Incluye margen_bruto, clasificada PHASE_1_WITH_GUARDRAILS; apta sólo como cálculo limitado."
    formulas_used:
      - ingresos_totales
      - margen_bruto
      - margen_bruto_pesos
      - markup
      - precio_venta_con_margen
    owner_facing_limit: "Calcula precio, margen bruto y markup con datos declarados; no define precio óptimo ni rentabilidad real."

  - tool_id: rentabilidad_por_producto
    title: Rentabilidad por Producto
    tool_phase: PHASE_1_WITH_GUARDRAILS
    decision: USE_IN_PHASE_1_WITH_GUARDRAILS
    reason: "Incluye margen_bruto, clasificada PHASE_1_WITH_GUARDRAILS; no debe llamarse diagnóstico de rentabilidad."
    formulas_used:
      - ingresos_totales
      - margen_bruto
      - margen_bruto_pesos
    owner_facing_limit: "Muestra margen bruto por producto con evidencia mínima; no confirma rentabilidad neta ni rentabilidad empresarial."

  - tool_id: simulador_inflacion
    title: Simulador de Inflación
    tool_phase: PHASE_1_WITH_GUARDRAILS
    decision: USE_IN_PHASE_1_WITH_GUARDRAILS
    reason: "Usa margen_bruto; puede operar como simulación limitada, no como diagnóstico de pricing."
    formulas_used:
      - ingresos_totales
      - margen_bruto
    owner_facing_limit: "Simula efecto sobre precio/margen con datos declarados; no recomienda estrategia comercial ni precio definitivo."

  - tool_id: auto_stock
    title: Control de Stock
    tool_phase: PHASE_2_DIAGNOSTIC
    decision: NOT_FOR_PHASE_1_PHASE_2
    reason: "Usa fórmulas PHASE_2_DIAGNOSTIC: rotacion_inventario y costo_reposicion_promedio."
    formulas_used:
      - alerta_stock_minimo
      - costo_reposicion_promedio
      - dias_stock_restante
      - rotacion_inventario
    owner_facing_limit: "Fuera de Fase 1. Requiere diagnóstico específico de stock/abastecimiento."

  - tool_id: compras_y_proveedores
    title: Compras y Proveedores
    tool_phase: PHASE_2_DIAGNOSTIC
    decision: NOT_FOR_PHASE_1_PHASE_2
    reason: "Usa fórmula PHASE_2_DIAGNOSTIC: costo_reposicion_promedio."
    formulas_used:
      - costo_reposicion_promedio
      - egresos_totales
    owner_facing_limit: "Fuera de Fase 1. Requiere diagnóstico específico de compras/proveedores."

  - tool_id: control_de_gastos
    title: Control de Gastos
    tool_phase: PHASE_2_DIAGNOSTIC
    decision: NOT_FOR_PHASE_1_PHASE_2
    reason: "Usa fórmula PHASE_2_DIAGNOSTIC: resultado_neto."
    formulas_used:
      - egresos_totales
      - resultado_neto
    owner_facing_limit: "Fuera de Fase 1. Requiere diagnóstico específico y evidencia suficiente de ingresos/egresos."

  - tool_id: punto_equilibrio
    title: Punto de Equilibrio
    tool_phase: PHASE_2_DIAGNOSTIC
    decision: NOT_FOR_PHASE_1_PHASE_2
    reason: "Usa fórmulas PHASE_2_DIAGNOSTIC: punto_equilibrio_pesos, punto_equilibrio_unidades y resultado_neto."
    formulas_used:
      - egresos_totales
      - ingresos_totales
      - margen_bruto
      - punto_equilibrio_pesos
      - punto_equilibrio_unidades
      - resultado_neto
    owner_facing_limit: "Fuera de Fase 1. Requiere diagnóstico específico; no corresponde a primeros auxilios."

  - tool_id: stock_control
    title: Control de Stock
    tool_phase: PHASE_2_DIAGNOSTIC
    decision: NOT_FOR_PHASE_1_PHASE_2
    reason: "Usa fórmulas PHASE_2_DIAGNOSTIC: rotacion_inventario y costo_reposicion_promedio."
    formulas_used:
      - alerta_stock_minimo
      - costo_reposicion_promedio
      - dias_stock_restante
      - rotacion_inventario
    owner_facing_limit: "Fuera de Fase 1. Requiere diagnóstico específico de stock/abastecimiento."

summary:
  total_tools: 14
  use_in_phase_1: 2
  use_in_phase_1_with_guardrails: 7
  not_for_phase_1_phase_2: 5
  review_required: 0
  phase_1_tools:
    - flujo_de_fondos
    - proyeccion_ventas
  phase_1_with_guardrails_tools:
    - auto_ganancia
    - caja_diaria
    - costos_por_producto
    - cuentas_corrientes_clientes
    - precio_margen
    - rentabilidad_por_producto
    - simulador_inflacion
  not_for_phase_1_tools:
    - auto_stock
    - compras_y_proveedores
    - control_de_gastos
    - punto_equilibrio
    - stock_control
  review_required_tools: []
