pack_id: first_aid_formula_activation_matrix_v1
source_file: PymIA-Live/docs/pymia/first_aid_toolbox_candidates/all_formula_refs_candidate.yaml
status: CANDIDATE_MATRIX
runtime_impact: NONE
code_impact: NONE

classification_policy:
  no_formula_excluded: true
  runtime_activation_authorized: false
  loader_authorized: false
  kernel_modification_authorized: false

formula_activation_matrix:
  - formula_id: margen_bruto
    category: pricing
    phase: PHASE_1_WITH_GUARDRAILS
    activation_policy: Puede calcularse en Primeros Auxilios si hay precio de venta y costo unitario trazables.
    required_inputs:
      - precio_venta
      - costo_unitario
    owner_facing_label: Margen bruto estimado
    owner_facing_limit: No confirma rentabilidad real; faltan costos indirectos, impuestos, descuentos, comisiones y estructura completa.
    forbidden_claims:
      - rentabilidad real confirmada
      - margen neto confirmado
      - diagnóstico integral de pricing
    escalation_trigger: Si el dueño pregunta por ganancia real, rentabilidad o estructura completa de costos, escalar a Fase 2.

  - formula_id: margen_bruto_pesos
    category: pricing
    phase: PHASE_1_READY
    activation_policy: Puede calcularse en Primeros Auxilios como señal puntual si hay precio de venta y costo unitario.
    required_inputs:
      - precio_venta
      - costo_unitario
    owner_facing_label: Margen bruto en pesos
    owner_facing_limit: Muestra diferencia simple entre precio y costo unitario; no resume el negocio completo.
    forbidden_claims:
      - rentabilidad empresarial confirmada
      - margen neto confirmado
      - diagnóstico financiero integral
    escalation_trigger: Si el valor dispara dudas sobre estructura de costos, descuentos o canales, escalar a Fase 2.

  - formula_id: precio_venta_con_margen
    category: pricing
    phase: PHASE_1_READY
    activation_policy: Puede usarse en Primeros Auxilios como simulación puntual si existen costo unitario y margen objetivo explícitos.
    required_inputs:
      - costo_unitario
      - margen_objetivo
    owner_facing_label: Precio sugerido con margen objetivo
    owner_facing_limit: Es una simulación simple; no incorpora mercado, demanda, impuestos, comisiones ni estrategia comercial.
    forbidden_claims:
      - precio óptimo definitivo
      - estrategia comercial completa
      - validación comercial cerrada
    escalation_trigger: Si el dueño pide precio final de mercado o política comercial, escalar a Fase 2.

  - formula_id: markup
    category: pricing
    phase: PHASE_1_READY
    activation_policy: Puede mostrarse en Primeros Auxilios como señal básica sobre relación entre precio y costo.
    required_inputs:
      - precio_venta
      - costo_unitario
    owner_facing_label: Markup estimado
    owner_facing_limit: Expresa recargo sobre costo; no prueba margen neto ni desempeño total del negocio.
    forbidden_claims:
      - rentabilidad real confirmada
      - margen neto real
      - diagnóstico completo de pricing
    escalation_trigger: Si el dueño interpreta markup como ganancia final o pide conclusiones estructurales, escalar a Fase 2.

  - formula_id: ingresos_totales
    category: financial
    phase: PHASE_1_READY
    activation_policy: Puede calcularse en Primeros Auxilios como señal puntual si hay precio y unidades vendidas trazables.
    required_inputs:
      - precio_venta
      - unidades_vendidas
    owner_facing_label: Ingresos totales estimados
    owner_facing_limit: Refleja ingresos simples del período; no explica costos, cobranzas pendientes ni resultado final.
    forbidden_claims:
      - ganancia confirmada
      - flujo de caja confirmado
      - diagnóstico integral del período
    escalation_trigger: Si el dueño quiere concluir utilidad, caja o desempeño total, escalar a Fase 2.

  - formula_id: egresos_totales
    category: financial
    phase: PHASE_1_WITH_GUARDRAILS
    activation_policy: Puede mostrarse en Primeros Auxilios si costos fijos, variables y unidades tienen trazabilidad mínima.
    required_inputs:
      - costos_fijos
      - costo_variable_unitario
      - unidades_vendidas
    owner_facing_label: Egresos totales estimados
    owner_facing_limit: No confirma costo total real si faltan egresos no registrados, impuestos, comisiones o pagos fuera de la fuente.
    forbidden_claims:
      - costo total real confirmado
      - resultado neto confirmado
      - auditoría contable cerrada
    escalation_trigger: Si aparecen dudas sobre gastos faltantes, estructura de costos o conciliación real, escalar a Fase 2.

  - formula_id: flujo_caja_neto
    category: cashflow
    phase: PHASE_1_READY
    activation_policy: Puede calcularse en Primeros Auxilios como señal puntual si hay ingresos cobrados y egresos pagados claramente identificados.
    required_inputs:
      - ingresos
      - egresos
    owner_facing_label: Flujo de caja neto estimado
    owner_facing_limit: Resume movimientos simples del período; no reemplaza conciliación bancaria ni análisis de caja completo.
    forbidden_claims:
      - saldo bancario conciliado
      - diagnóstico financiero integral
      - disponibilidad total confirmada
    escalation_trigger: Si el dueño necesita conciliación, proyección o explicación de baches de caja, escalar a Fase 2.

  - formula_id: saldo_acumulado
    category: cashflow
    phase: PHASE_1_READY
    activation_policy: Puede mostrarse en Primeros Auxilios si existen saldo anterior y flujo neto del período con trazabilidad mínima.
    required_inputs:
      - saldo_anterior
      - flujo_neto
    owner_facing_label: Saldo acumulado estimado
    owner_facing_limit: Es una continuidad matemática simple; no confirma saldo bancario real ni conciliación completa.
    forbidden_claims:
      - saldo bancario conciliado con una sola fuente
      - caja final confirmada
      - auditoría financiera cerrada
    escalation_trigger: Si el dueño necesita validar saldo real, desvíos o conciliación, escalar a Fase 2.

  - formula_id: alerta_stock_minimo
    category: stock
    phase: PHASE_1_READY
    activation_policy: Puede usarse en Primeros Auxilios como señal puntual si hay stock actual y umbral mínimo definidos.
    required_inputs:
      - stock_actual
      - stock_minimo
    owner_facing_label: Alerta de stock mínimo
    owner_facing_limit: Señala riesgo simple sobre el dato cargado; no confirma stock físico ni disponibilidad real en depósito.
    forbidden_claims:
      - stock físico confirmado
      - inventario conciliado
      - diagnóstico integral de abastecimiento
    escalation_trigger: Si el dueño necesita validar stock físico, quiebres recurrentes o reposición estructural, escalar a Fase 2.

  - formula_id: dias_stock_restante
    category: stock
    phase: PHASE_1_WITH_GUARDRAILS
    activation_policy: Puede mostrarse en Primeros Auxilios si stock actual y ventas diarias promedio son confiables y recientes.
    required_inputs:
      - stock_actual
      - ventas_diarias_promedio
    owner_facing_label: Días estimados de stock restante
    owner_facing_limit: Es una aproximación sensible a la calidad del promedio de ventas; no garantiza cobertura real ni reposición efectiva.
    forbidden_claims:
      - fecha exacta de quiebre confirmada
      - stock físico confirmado
      - política de reposición cerrada
    escalation_trigger: Si el dueño pregunta por abastecimiento estructural, rotación real o quiebres críticos, escalar a Fase 2.

  - formula_id: resultado_neto
    category: financial
    phase: PHASE_2_DIAGNOSTIC
    activation_policy: Requiere evidencia suficiente de ingresos y egresos completos antes de activarse; no corresponde a Primeros Auxilios simple.
    required_inputs:
      - ingresos_totales
      - egresos_totales
    owner_facing_label: Resultado neto del período
    owner_facing_limit: Puede inducir diagnóstico financiero si faltan costos, impuestos, comisiones o movimientos no capturados.
    forbidden_claims:
      - rentabilidad real confirmada
      - cierre financiero definitivo
      - diagnóstico integral de la empresa
    escalation_trigger: Si el dueño busca concluir ganancia real o salud financiera total, mantener en Fase 2.

  - formula_id: punto_equilibrio_unidades
    category: financial
    phase: PHASE_2_DIAGNOSTIC
    activation_policy: Requiere costos fijos, precio y costo variable con suficiencia fuerte; no debe activarse como señal simple.
    required_inputs:
      - costos_fijos
      - precio_venta
      - costo_variable_unitario
    owner_facing_label: Punto de equilibrio en unidades
    owner_facing_limit: Puede inducir conclusiones empresariales fuertes si la estructura de costos no está completa o estabilizada.
    forbidden_claims:
      - punto de equilibrio empresarial total sin evidencia suficiente
      - viabilidad confirmada del negocio
      - diagnóstico definitivo de pricing
    escalation_trigger: Si el dueño pide decisiones de escala, viabilidad o estructura completa, mantener en Fase 2.

  - formula_id: punto_equilibrio_pesos
    category: financial
    phase: PHASE_2_DIAGNOSTIC
    activation_policy: Requiere margen de contribución y costos fijos suficientemente confiables; no corresponde a activación liviana.
    required_inputs:
      - costos_fijos
      - margen_contribucion
    owner_facing_label: Punto de equilibrio en pesos
    owner_facing_limit: Puede dar falsa precisión si el margen de contribución no representa todos los costos relevantes.
    forbidden_claims:
      - punto de equilibrio empresarial total sin evidencia suficiente
      - facturación mínima definitiva confirmada
      - diagnóstico integral financiero
    escalation_trigger: Si el dueño quiere usarlo para decisiones estructurales o metas definitivas, mantener en Fase 2.

  - formula_id: rotacion_inventario
    category: stock
    phase: PHASE_2_DIAGNOSTIC
    activation_policy: Requiere cruce entre CMV e inventario promedio con contexto fuerte; no es señal simple de Primeros Auxilios.
    required_inputs:
      - costo_mercaderia_vendida
      - inventario_promedio
    owner_facing_label: Rotación estimada de inventario
    owner_facing_limit: Necesita contexto de período, valuación e inventario consistente para evitar lecturas engañosas.
    forbidden_claims:
      - stock optimizado confirmado
      - eficiencia de inventario confirmada
      - diagnóstico completo de abastecimiento
    escalation_trigger: Si el dueño necesita explicar inmovilización, quiebres o desempeño estructural de stock, mantener en Fase 2.

  - formula_id: costo_reposicion_promedio
    category: stock
    phase: PHASE_2_DIAGNOSTIC
    activation_policy: Requiere stock actual, costos vigentes y reposición trazable; no debe activarse sin contexto más amplio.
    required_inputs:
      - stock_actual
      - costo_actual
      - unidades_nuevas
      - costo_nuevo
    owner_facing_label: Costo promedio de reposición estimado
    owner_facing_limit: Puede inducir decisiones de pricing o rentabilidad si faltan contexto de compras, mermas o costos adicionales.
    forbidden_claims:
      - costo definitivo de reposición confirmado
      - rentabilidad real confirmada
      - diagnóstico integral de abastecimiento
    escalation_trigger: Si el dueño quiere decidir precio final, margen real o política de compras, mantener en Fase 2.

global_forbidden_claims:
  - rentabilidad real confirmada
  - margen neto real sin costos completos
  - saldo bancario conciliado con una sola fuente
  - stock físico confirmado sin conteo
  - auditoría contable cerrada
  - precio óptimo definitivo
  - estrategia comercial completa
  - punto de equilibrio empresarial total sin evidencia suficiente
  - diagnóstico integral de la empresa

summary:
  total_formulas: 15
  phase_1_ready: 7
  phase_1_with_guardrails: 3
  phase_2_diagnostic: 5
