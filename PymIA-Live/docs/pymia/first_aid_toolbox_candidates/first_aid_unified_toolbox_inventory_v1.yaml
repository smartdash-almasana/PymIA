metadata:
  artifact: first_aid_unified_toolbox_inventory_v1
  status: CANDIDATE_INVENTORY
  purpose: "Inventario unificado candidato de Primeros Auxilios PyME / Fase 1, cruzando Exceland seleccionado y SmartCounter Phase 1."
  runtime_impact: NONE
  code_impact: NONE
  tests_run: NO
  source_files:
    - PymIA-Live/docs/pymia/first_aid_toolbox_candidates/first_aid_tool_selection_matrix_v1.yaml
    - PymIA-Live/docs/pymia/smartcounter_candidates/phase_1_first_aid_candidates.yaml

policy:
  service_phase: FIRST_AID_PHASE_1
  rule: "Fase 1 calcula, ordena, valida, alerta y pide evidencia; no diagnostica."
  requires_minimal_case_file_layer: true
  runtime_activation: false
  kernel_impact: false

inventory:
  exceland_tools:
    use_in_phase_1:
      - id: flujo_de_fondos
        title: Flujo de Fondos Proyectado
        role: calculation_tool
        decision: USE_IN_PHASE_1
        owner_limit: "Ordena ingresos, egresos y saldo acumulado; no confirma caja real ni conciliación bancaria."
      - id: proyeccion_ventas
        title: Proyección de Ventas
        role: calculation_tool
        decision: USE_IN_PHASE_1
        owner_limit: "Calcula ingresos con precio y unidades informadas; no interpreta rentabilidad ni estrategia comercial."

    use_in_phase_1_with_guardrails:
      - id: auto_ganancia
        title: Caja Diaria
        role: calculation_tool_with_guardrails
        decision: USE_IN_PHASE_1_WITH_GUARDRAILS
        owner_limit: "Ordena caja diaria y saldos declarados; no confirma ganancia, caja final ni resultado contable."
      - id: caja_diaria
        title: Caja Diaria Pro
        role: calculation_tool_with_guardrails
        decision: USE_IN_PHASE_1_WITH_GUARDRAILS
        owner_limit: "Ordena caja diaria y saldos declarados; no confirma ganancia, caja final ni resultado contable."
      - id: costos_por_producto
        title: Costos por Producto
        role: calculation_tool_with_guardrails
        decision: USE_IN_PHASE_1_WITH_GUARDRAILS
        owner_limit: "Calcula costos e ingresos sobre datos entregados; no certifica costo total real ni margen neto."
      - id: cuentas_corrientes_clientes
        title: Cuentas Corrientes Clientes
        role: calculation_tool_with_guardrails
        decision: USE_IN_PHASE_1_WITH_GUARDRAILS
        owner_limit: "Ordena saldos y movimientos declarados; no confirma deuda real ni conciliación bancaria."
      - id: precio_margen
        title: Calculadora Precio & Margen
        role: calculation_tool_with_guardrails
        decision: USE_IN_PHASE_1_WITH_GUARDRAILS
        owner_limit: "Calcula precio, margen bruto y markup con datos declarados; no define precio óptimo ni rentabilidad real."
      - id: rentabilidad_por_producto
        title: Rentabilidad por Producto
        role: calculation_tool_with_guardrails
        decision: USE_IN_PHASE_1_WITH_GUARDRAILS
        owner_limit: "Muestra margen bruto por producto con evidencia mínima; no confirma rentabilidad neta ni rentabilidad empresarial."
      - id: simulador_inflacion
        title: Simulador de Inflación
        role: simulation_tool_with_guardrails
        decision: USE_IN_PHASE_1_WITH_GUARDRAILS
        owner_limit: "Simula efecto sobre precio/margen con datos declarados; no recomienda estrategia comercial ni precio definitivo."

  smartcounter_packs:
    use_in_phase_1:
      - id: ExcelStructureValidationPack
        source_doc: excel_treatment_lab.md
        role: validation_pack
        decision: USE_IN_PHASE_1
        required_evidence: "Raw uploaded Excel file."
        owner_limit: "Checks tabular shape, headers, and type formats; does not validate business logic truth."
      - id: SimpleCashArqueoChecklist
        source_doc: cash_simple_check.md
        role: checklist_pack
        decision: USE_IN_PHASE_1
        required_evidence: "Daily manual cash counts, transaction tickets."
        owner_limit: "Relies on manual inputs; cannot automatically verify cash physically present."
      - id: StockDesvioAlertRule
        source_doc: stock_faltantes_detection.md
        role: alert_rule_pack
        decision: USE_IN_PHASE_1_WITH_GUARDRAILS
        required_evidence: "Daily sales orders and physical inventory count logs."
        owner_limit: "Highlights deviations; does not explain cause such as theft, loss, or unregistered consumption."
      - id: CostPriceReviewHeuristic
        source_doc: cost_price_review.md
        role: heuristic_pack
        decision: USE_IN_PHASE_1_WITH_GUARDRAILS
        required_evidence: "Sales price catalog and supplier invoices/cost lists."
        owner_limit: "Uses historical cost list averages; does not forecast immediate price inflation."
      - id: OwnerSignalTemplate
        source_doc: initial_signal_protocol.md
        role: owner_facing_copy_pack
        decision: USE_IN_PHASE_1
        required_evidence: "Normalized warning flags and metrics."
        owner_limit: "Alert delivery only; does not solve the root problem."

not_for_phase_1:
  exceland_tools:
    - auto_stock
    - compras_y_proveedores
    - control_de_gastos
    - punto_equilibrio
    - stock_control
  smartcounter_packs: []

suggested_first_aid_compositions:
  - composition_id: excel_triage_basic
    purpose: "Revisar estructura mínima de Excel antes de aplicar cálculos."
    components:
      - ExcelStructureValidationPack
      - flujo_de_fondos
      - proyeccion_ventas
    output_limit: "Validación estructural + cálculos básicos; no diagnóstico financiero."

  - composition_id: cash_ordering_basic
    purpose: "Ordenar caja diaria declarada y saldos simples."
    components:
      - SimpleCashArqueoChecklist
      - caja_diaria
      - flujo_de_fondos
    output_limit: "Ordenamiento de caja declarada; no arqueo certificado ni conciliación bancaria."

  - composition_id: price_margin_basic
    purpose: "Revisar precio, margen bruto y señales básicas de costo/precio."
    components:
      - CostPriceReviewHeuristic
      - precio_margen
      - rentabilidad_por_producto
    output_limit: "Cálculo y alerta limitada; no precio óptimo ni rentabilidad real confirmada."

  - composition_id: owner_alert_basic
    purpose: "Comunicar señales al dueño con lenguaje limitado y no diagnóstico."
    components:
      - OwnerSignalTemplate
    output_limit: "Mensaje owner-facing de alerta; no explicación causal ni tratamiento."

forbidden_language:
  forbidden_verbs:
    - diagnostica
    - confirma
    - certifica
    - revela
    - demuestra
    - garantiza
  forbidden_claims:
    - diagnóstico integral de la empresa
    - auditoría contable certificada
    - rentabilidad real confirmada
    - precio óptimo definitivo
    - caja final confirmada
    - stock físico confirmado sin conteo
    - causa raíz confirmada

summary:
  exceland_total_selected_for_phase_1: 9
  exceland_phase_1_ready: 2
  exceland_phase_1_with_guardrails: 7
  exceland_not_for_phase_1: 5
  smartcounter_phase_1_candidates: 5
  unified_phase_1_components: 14
  runtime_impact: NONE
  code_impact: NONE
