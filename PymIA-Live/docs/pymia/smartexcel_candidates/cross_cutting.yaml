    service_fit: CROSS_CUTTING_VALUE
    suggested_pack_type: DataModelPack
    why_valuable: "Permite diferenciar dato medido de dato dudoso."
    required_evidence: "Resultado de extracción."
    owner_facing_limit: "No usar dato de baja confianza en cálculos sin advertencia."
    migration_risk: LOW
    confidence: HIGH

