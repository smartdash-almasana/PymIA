    item_type: data_model
    service_fit: CROSS_CUTTING_VALUE
    suggested_pack_type: DataModelPack
    why_valuable: "Reusable en Excel, evidencia, owner report y operator report."
    required_evidence: "Evento de validación o parsing."
    owner_facing_limit: "Mostrar sólo advertencias comprensibles y accionables."
    migration_risk: LOW
    confidence: HIGH

  - id: parsing_confidence_flag
