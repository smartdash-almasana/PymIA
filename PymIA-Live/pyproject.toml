[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymia-live"
version = "0.1.0"
description = "PymIA Live — núcleo operativo limpio"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "openpyxl>=3.1",
    "pandas>=2.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pymia*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
