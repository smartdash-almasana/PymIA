<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PymIA Servicio 1 - preguntas dinamicas</title>
  <style>
    :root { font-family: Arial, sans-serif; color: #172033; background: #f6f7fb; }
    body { margin: 0; padding: 24px; }
    main { max-width: 980px; margin: 0 auto; background: #fff; border: 1px solid #d8deea; border-radius: 8px; padding: 20px; }
    h1 { font-size: 22px; margin: 0 0 14px; }
    h2 { font-size: 17px; margin: 24px 0 10px; }
    label { display: block; margin: 12px 0 6px; font-weight: 700; }
    input, textarea, button { font: inherit; }
    input[type="text"], input[type="url"], textarea { width: 100%; box-sizing: border-box; padding: 9px; border: 1px solid #c8d0df; border-radius: 6px; }
    input[type="file"] { width: 100%; }
    textarea { min-height: 58px; resize: vertical; }
    button { border: 0; border-radius: 6px; padding: 10px 14px; background: #2457d6; color: #fff; cursor: pointer; margin: 8px 8px 8px 0; }
    button:disabled { background: #9aa5ba; cursor: wait; }
    .question { border: 1px solid #d8deea; border-radius: 8px; padding: 12px; margin: 10px 0; background: #fbfcff; }
    .muted { color: #64708a; font-size: 13px; }
    .ok { color: #126b38; font-weight: 700; }
    .bad { color: #a32626; font-weight: 700; }
    pre { overflow: auto; background: #101827; color: #dce7ff; padding: 12px; border-radius: 8px; max-height: 360px; }
  </style>
</head>
<body>
<main>
  <h1>Servicio 1 - loop real de preguntas del dueño</h1>
  <p class="muted">Sin respuestas CASE_001 precargadas. La web pide preguntas al backend y vos las contestas.</p>

  <label>Endpoint backend</label>
  <input id="endpoint" type="url" value="http://127.0.0.1:8000" />

  <label>Excel XLSX</label>
  <input id="xlsx" type="file" accept=".xlsx" />

  <label>Carpeta de delivery</label>
  <input id="outputDir" type="text" value="E:\\BuenosPasos\\smartbridge\\PymIA\\.tmp\\service_1_web_dynamic_owner_question_loop_delivery" />

  <button id="loadColumnQuestions">1. Leer Excel y mostrar preguntas</button>

  <section id="columnSection" hidden>
    <h2>Preguntas sobre columnas</h2>
    <div id="columnQuestions"></div>
    <button id="loadSemanticQuestions">2. Continuar y mostrar preguntas semanticas</button>
  </section>

  <section id="semanticSection" hidden>
    <h2>Preguntas semanticas</h2>
    <div id="semanticQuestions"></div>
    <button id="runDelivery">3. Procesar y crear delivery</button>
  </section>

  <h2>Estado</h2>
  <div id="status" class="muted">Listo.</div>
  <pre id="output">{}</pre>
</main>

<script>
const $ = (id) => document.getElementById(id);
let currentFile = null;
let lastColumnQuestions = [];
let lastSemanticQuestions = [];

function setBusy(isBusy) {
  for (const button of document.querySelectorAll('button')) button.disabled = isBusy;
}

function setStatus(text, ok = null) {
  const el = $('status');
  el.textContent = text;
  el.className = ok === true ? 'ok' : ok === false ? 'bad' : 'muted';
}

function showJson(value) {
  $('output').textContent = JSON.stringify(value, null, 2);
}

function endpoint(path) {
  return $('endpoint').value.replace(/\/$/, '') + path;
}

function requireFile() {
  const file = $('xlsx').files[0];
  if (!file) throw new Error('Elegi un archivo XLSX primero.');
  currentFile = file;
  return file;
}

function formWithFile(payload) {
  const form = new FormData();
  form.append('file', requireFile(), currentFile.name);
  if (payload !== undefined) form.append('payload_json', JSON.stringify(payload));
  return form;
}

async function postMultipart(path, payload) {
  const response = await fetch(endpoint(path), { method: 'POST', body: formWithFile(payload) });
  const body = await response.json();
  if (!response.ok) throw new Error(`${response.status} ${body.blocked_reason || body.status}`);
  return body;
}

function renderQuestions(containerId, questions, prefix) {
  const container = $(containerId);
  container.innerHTML = '';
  for (const question of questions) {
    const box = document.createElement('div');
    box.className = 'question';
    const column = question.column_name || question.column || question.question_id;
    box.innerHTML = `<label>${question.question || column}</label><textarea data-prefix="${prefix}" data-column="${String(column).replaceAll('"', '&quot;')}"></textarea>`;
    container.appendChild(box);
  }
}

function collectAnswers(prefix) {
  const answers = {};
  for (const field of document.querySelectorAll(`[data-prefix="${prefix}"]`)) {
    const column = field.getAttribute('data-column');
    const value = field.value.trim();
    if (!value) throw new Error(`Falta responder: ${column}`);
    answers[column] = value;
  }
  return answers;
}

$('loadColumnQuestions').addEventListener('click', async () => {
  try {
    setBusy(true); setStatus('Leyendo Excel y pidiendo preguntas...');
    const body = await postMultipart('/service-1/experiment/questions');
    lastColumnQuestions = body.owner_questions || [];
    renderQuestions('columnQuestions', lastColumnQuestions, 'column');
    $('columnSection').hidden = false;
    $('semanticSection').hidden = true;
    setStatus(`Preguntas de columnas: ${lastColumnQuestions.length}`, true);
    showJson(body);
  } catch (err) { setStatus(String(err.message || err), false); }
  finally { setBusy(false); }
});

$('loadSemanticQuestions').addEventListener('click', async () => {
  try {
    setBusy(true); setStatus('Procesando respuestas y pidiendo preguntas semanticas...');
    const ownerColumnAnswers = collectAnswers('column');
    const body = await postMultipart('/service-1/experiment/semantic-questions', { owner_column_answers: ownerColumnAnswers });
    lastSemanticQuestions = body.owner_questions || [];
    renderQuestions('semanticQuestions', lastSemanticQuestions, 'semantic');
    $('semanticSection').hidden = false;
    setStatus(`Preguntas semanticas: ${lastSemanticQuestions.length}`, true);
    showJson(body);
  } catch (err) { setStatus(String(err.message || err), false); }
  finally { setBusy(false); }
});

$('runDelivery').addEventListener('click', async () => {
  try {
    setBusy(true); setStatus('Ejecutando flujo y creando delivery...');
    const payload = {
      owner_column_answers: collectAnswers('column'),
      semantic_owner_answers: collectAnswers('semantic'),
      owner_authorization: 'accept',
      owner_validation: 'accept',
      delivery_authorized: true,
      output_dir: $('outputDir').value.trim()
    };
    const body = await postMultipart('/service-1/experiment/run', payload);
    setStatus(`${body.status} - ${body.blocked_reason || 'OK'}`, body.status === 'WEB_BACKEND_DELIVERY_READY');
    showJson(body);
  } catch (err) { setStatus(String(err.message || err), false); }
  finally { setBusy(false); }
});
</script>
</body>
</html>
