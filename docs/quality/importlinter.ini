; NOP3-HEALTH-010 — Import Linter architecture baseline.
; Mode: REPORT_ONLY. Findings are evidence, not a remediation gate.
;
; These contracts intentionally cover only import-expressible boundaries:
; - the canonical Service 1 product root must not depend on outer application
;   surfaces;
; - services and domain are lower-level components and must not depend on
;   application, delivery, CLI, or product surfaces;
; - top-level package cycles are observed by Import Linter.
; Runtime authority, semantic authority, evidence sufficiency, and delivery
; authorization cannot be proven by imports alone and are out of scope here.

[importlinter]
root_package = pymia
include_external_packages = false

[importlinter:service-1-product-root-boundary]
name = Service 1 product root does not import outer application surfaces
type = forbidden
source_modules = pymia.smartpyme.service_1_product_pipeline_v1
forbidden_modules = pymia.application, pymia.cli, pymia.microsaas

[importlinter:services-kernel-boundary]
name = Services do not import application or product surfaces
type = forbidden
source_modules = pymia.services
forbidden_modules = pymia.application, pymia.cli, pymia.microsaas, pymia.smartpyme

[importlinter:domain-boundary]
name = Domain does not import higher-level runtime surfaces
type = forbidden
source_modules = pymia.domain
forbidden_modules = pymia.services, pymia.application, pymia.cli, pymia.microsaas, pymia.smartpyme, pymia.audit_result

[importlinter:top-level-acyclic]
name = PymIA top-level packages remain acyclic
type = acyclic_siblings
ancestors = pymia
depth = 2
