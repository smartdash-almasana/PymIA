name: PymIA Canonical CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  canonical-test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install canonical project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify single package origin
        run: python -c "import pymia; print(pymia.__file__)"
      - name: Run canonical regression
        run: python -m pytest -q
      - name: Build distribution
        run: python -m build
