name: M31-P Textil Pilot Measurement

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "docs/smartpyme/pilots/M31P-002.md"
      - "docs/smartpyme/M31P_PILOTS_REGISTRY.md"
      - "tests/test_excel_evidence.py"
      - "tests/test_document_ingestion.py"
      - "tools/excel_evidence.py"
      - "tools/document_ingestion.py"
      - "prueba_excels/**"
      - ".github/workflows/m31p-textil-pilot.yml"

jobs:
  m31p-textil-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pydantic openpyxl pandas mcp PyYAML pytest

      - name: Verify M31-P fixture exists
        run: test -f prueba_excels/la_textil_cosida_srl_mar_abr_may_2026.xlsx

      - name: Run measured M31-P textil pilot tests
        run: python -m pytest tests/test_excel_evidence.py tests/test_document_ingestion.py -q
